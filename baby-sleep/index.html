<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7e9f0" />
<title>Little Dreams — Baby Sleep Tracker</title>
<style>
  :root {
    --bg: #fbf5f0;
    --bg-soft: #f7e9f0;
    --card: #ffffff;
    --card-edge: #f0e1dc;
    --ink: #4a3b46;
    --ink-soft: #8a7a85;
    --accent: #f5c0c5;
    --accent-deep: #e89aa3;
    --mint: #c7e6d4;
    --mint-deep: #8fc8a9;
    --lavender: #d7cdf0;
    --butter: #fde9b8;
    --danger: #e88f8f;
    --shadow: 0 8px 24px rgba(180, 140, 160, .12);
    --radius: 22px;
    --radius-sm: 14px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Nunito",
                 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }
  header.app {
    text-align: center;
    padding: 8px 0 22px;
  }
  header.app h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.app p {
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .moon {
    display: inline-block;
    transform: translateY(2px);
    margin-right: 4px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-edge);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px;
    margin-bottom: 18px;
  }
  .timer-card {
    text-align: center;
    background: linear-gradient(160deg, #ffffff 0%, var(--bg-soft) 100%);
  }
  .status {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .status.sleeping { color: var(--accent-deep); }
  .clock {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
    font-size: 56px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 4px 0 2px;
  }
  .started-at {
    color: var(--ink-soft);
    font-size: 13px;
    margin-bottom: 18px;
    min-height: 18px;
  }
  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-weight: 600;
    transition: transform .08s ease, box-shadow .15s ease, background .15s ease;
    color: var(--ink);
    background: var(--bg-soft);
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button.primary {
    background: var(--accent);
    color: #5a2e3a;
    box-shadow: 0 4px 12px rgba(232, 154, 163, .35);
  }
  button.primary:hover { background: var(--accent-deep); color: #fff; }
  button.mint {
    background: var(--mint);
    color: #2e5a44;
  }
  button.mint:hover { background: var(--mint-deep); color: #fff; }
  button.ghost {
    background: transparent;
    color: var(--ink-soft);
    padding: 10px 14px;
  }
  button.ghost:hover { color: var(--ink); background: var(--bg-soft); }
  button.small {
    padding: 8px 14px;
    font-size: 13px;
  }
  button.danger { color: var(--danger); background: transparent; }
  button.danger:hover { background: #fde6e6; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  h2 {
    font-size: 16px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .muted { color: var(--ink-soft); font-size: 13px; }
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  .stat {
    background: var(--bg);
    border-radius: var(--radius-sm);
    padding: 14px 10px;
    text-align: center;
  }
  .stat .v {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-top: 4px;
  }
  .stat.accent { background: #fbe2e6; }
  .stat.mint   { background: #dcefe2; }
  .stat.butter { background: #fcf1d3; }

  ul.sessions {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul.sessions li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 4px;
    border-bottom: 1px dashed var(--card-edge);
    gap: 10px;
  }
  ul.sessions li:last-child { border-bottom: none; }
  ul.sessions .when {
    font-size: 14px;
    font-weight: 600;
  }
  ul.sessions .meta {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  ul.sessions .dur {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    color: var(--accent-deep);
    margin-right: 6px;
  }
  .empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 22px 8px;
    font-size: 14px;
  }
  .day-group {
    margin-top: 14px;
  }
  .day-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin: 6px 4px 2px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(74, 59, 70, 0.35);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: var(--radius);
    width: 100%;
    max-width: 460px;
    padding: 22px;
    box-shadow: 0 20px 60px rgba(74, 59, 70, .25);
  }
  .modal h3 { margin: 0 0 14px; font-size: 18px; }
  label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin: 12px 0 6px;
  }
  input[type="datetime-local"], textarea {
    width: 100%;
    border: 1px solid var(--card-edge);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font: inherit;
    color: var(--ink);
    background: var(--bg);
  }
  textarea { resize: vertical; min-height: 60px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  @media (min-width: 520px) {
    .modal-backdrop { align-items: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="app">
    <h1><span class="moon" aria-hidden="true">🌙</span> Little Dreams</h1>
    <p>A cozy place to track your little one's sleep.</p>
  </header>

  <section class="card timer-card" aria-live="polite">
    <div class="status" id="status">Awake</div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="started-at" id="startedAt">&nbsp;</div>
    <div class="actions">
      <button class="primary" id="toggleBtn">Start sleep</button>
      <button class="ghost small" id="addManualBtn">+ Add past sleep</button>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <h2>Today</h2>
      <span class="muted" id="todayDate"></span>
    </div>
    <div class="summary">
      <div class="stat accent">
        <div class="v" id="statTotal">0h 0m</div>
        <div class="l">Total sleep</div>
      </div>
      <div class="stat mint">
        <div class="v" id="statNaps">0</div>
        <div class="l">Sessions</div>
      </div>
      <div class="stat butter">
        <div class="v" id="statAvg">0m</div>
        <div class="l">Avg length</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="row">
      <h2>History</h2>
      <button class="ghost small" id="exportBtn" title="Export as JSON">Export</button>
    </div>
    <div id="historyList"></div>
  </section>

  <p class="muted" style="text-align:center; font-size:12px; margin-top:24px;">
    Saved locally on this device. No account, no cloud.
  </p>
</main>

<!-- Manual / edit modal -->
<div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <h3 id="modalTitle">Add sleep session</h3>
    <label for="startInput">Start</label>
    <input type="datetime-local" id="startInput" />
    <label for="endInput">End</label>
    <input type="datetime-local" id="endInput" />
    <label for="noteInput">Note (optional)</label>
    <textarea id="noteInput" placeholder="e.g. Afternoon nap, woke up fussy…"></textarea>
    <div class="modal-actions">
      <button class="danger small" id="deleteBtn" style="margin-right:auto; display:none;">Delete</button>
      <button class="ghost" id="cancelBtn">Cancel</button>
      <button class="primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const STORAGE_KEY    = "littleDreams.sessions.v1";
  const ACTIVE_KEY     = "littleDreams.active.v1";

  // ---------- storage ----------
  const load = () => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  };
  const save = (sessions) => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  };
  const loadActive = () => {
    try {
      const raw = localStorage.getItem(ACTIVE_KEY);
      if (!raw) return null;
      const v = JSON.parse(raw);
      return (v && typeof v.start === "number") ? v : null;
    } catch { return null; }
  };
  const saveActive = (v) => {
    if (v) localStorage.setItem(ACTIVE_KEY, JSON.stringify(v));
    else localStorage.removeItem(ACTIVE_KEY);
  };

  // ---------- state ----------
  let sessions = load();        // [{id, start, end, note}]
  let active   = loadActive();  // {start} or null
  let editingId = null;

  // ---------- formatting ----------
  const pad = (n) => String(n).padStart(2, "0");
  const fmtClock = (ms) => {
    const s = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return `${pad(h)}:${pad(m)}:${pad(sec)}`;
  };
  const fmtDur = (ms) => {
    const mins = Math.max(0, Math.round(ms / 60000));
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    if (h === 0) return `${m}m`;
    return `${h}h ${m}m`;
  };
  const fmtTime = (ts) => {
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  const fmtDayLabel = (ts) => {
    const d = new Date(ts);
    const today = new Date();
    const yesterday = new Date(); yesterday.setDate(today.getDate() - 1);
    const same = (a, b) =>
      a.getFullYear() === b.getFullYear() &&
      a.getMonth() === b.getMonth() &&
      a.getDate() === b.getDate();
    if (same(d, today)) return "Today";
    if (same(d, yesterday)) return "Yesterday";
    return d.toLocaleDateString([], {
      weekday: "long", month: "short", day: "numeric"
    });
  };
  const dayKey = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  };
  const todayKey = () => dayKey(Date.now());

  const toLocalInput = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` +
           `T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const fromLocalInput = (s) => {
    if (!s) return NaN;
    const t = new Date(s).getTime();
    return Number.isFinite(t) ? t : NaN;
  };

  // ---------- elements ----------
  const $ = (id) => document.getElementById(id);
  const els = {
    status:     $("status"),
    clock:      $("clock"),
    startedAt:  $("startedAt"),
    toggleBtn:  $("toggleBtn"),
    addManual:  $("addManualBtn"),
    todayDate:  $("todayDate"),
    statTotal:  $("statTotal"),
    statNaps:   $("statNaps"),
    statAvg:    $("statAvg"),
    history:    $("historyList"),
    modal:      $("modal"),
    modalTitle: $("modalTitle"),
    startInput: $("startInput"),
    endInput:   $("endInput"),
    noteInput:  $("noteInput"),
    saveBtn:    $("saveBtn"),
    cancelBtn:  $("cancelBtn"),
    deleteBtn:  $("deleteBtn"),
    exportBtn:  $("exportBtn"),
  };

  // ---------- timer ----------
  let tickHandle = null;
  const startTicking = () => {
    if (tickHandle) return;
    tickHandle = setInterval(renderClock, 1000);
  };
  const stopTicking = () => {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  };

  // ---------- render ----------
  const renderClock = () => {
    if (active) {
      const elapsed = Date.now() - active.start;
      els.clock.textContent = fmtClock(elapsed);
      els.status.textContent = "Sleeping";
      els.status.classList.add("sleeping");
      els.startedAt.textContent = `Started at ${fmtTime(active.start)}`;
      els.toggleBtn.textContent = "Stop sleep";
      els.toggleBtn.classList.remove("primary");
      els.toggleBtn.classList.add("mint");
    } else {
      els.clock.textContent = "00:00:00";
      els.status.textContent = "Awake";
      els.status.classList.remove("sleeping");
      els.startedAt.innerHTML = "&nbsp;";
      els.toggleBtn.textContent = "Start sleep";
      els.toggleBtn.classList.remove("mint");
      els.toggleBtn.classList.add("primary");
    }
  };

  const renderSummary = () => {
    const k = todayKey();
    const todays = sessions.filter(s => dayKey(s.start) === k && s.end);
    const totalMs = todays.reduce((sum, s) => sum + (s.end - s.start), 0);
    const n = todays.length;
    els.statTotal.textContent = fmtDur(totalMs);
    els.statNaps.textContent  = String(n);
    els.statAvg.textContent   = n === 0 ? "0m" : fmtDur(totalMs / n);
    els.todayDate.textContent = new Date().toLocaleDateString([], {
      month: "short", day: "numeric"
    });
  };

  const renderHistory = () => {
    const finished = sessions.filter(s => s.end).sort((a, b) => b.start - a.start);
    if (finished.length === 0) {
      els.history.innerHTML = `<div class="empty">No sleep sessions yet.<br/>Tap “Start sleep” when nap time begins. 💤</div>`;
      return;
    }
    const groups = new Map();
    for (const s of finished) {
      const k = dayKey(s.start);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    }
    let html = "";
    for (const [k, items] of groups) {
      html += `<div class="day-group"><div class="day-label">${escapeHtml(fmtDayLabel(items[0].start))}</div><ul class="sessions">`;
      for (const s of items) {
        const dur = fmtDur(s.end - s.start);
        const note = s.note ? ` · ${escapeHtml(s.note)}` : "";
        html += `
          <li data-id="${s.id}">
            <div>
              <div class="when">${escapeHtml(fmtTime(s.start))} – ${escapeHtml(fmtTime(s.end))}</div>
              <div class="meta">Duration ${escapeHtml(dur)}${note}</div>
            </div>
            <div>
              <span class="dur">${escapeHtml(dur)}</span>
              <button class="ghost small" data-edit="${s.id}" aria-label="Edit">Edit</button>
            </div>
          </li>`;
      }
      html += `</ul></div>`;
    }
    els.history.innerHTML = html;
    els.history.querySelectorAll("[data-edit]").forEach(btn => {
      btn.addEventListener("click", () => openEditModal(btn.getAttribute("data-edit")));
    });
  };

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));

  const renderAll = () => {
    renderClock();
    renderSummary();
    renderHistory();
  };

  // ---------- actions ----------
  const newId = () =>
    (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : "s_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const toggleSleep = () => {
    if (active) {
      const end = Date.now();
      if (end <= active.start) {
        // ignore zero-length entries (e.g. accidental double tap)
        active = null;
        saveActive(null);
      } else {
        sessions.push({
          id: newId(),
          start: active.start,
          end,
          note: ""
        });
        save(sessions);
        active = null;
        saveActive(null);
      }
      stopTicking();
    } else {
      active = { start: Date.now() };
      saveActive(active);
      startTicking();
    }
    renderAll();
  };

  const openAddModal = () => {
    editingId = null;
    els.modalTitle.textContent = "Add past sleep";
    const now = Date.now();
    els.startInput.value = toLocalInput(now - 60 * 60 * 1000);
    els.endInput.value   = toLocalInput(now);
    els.noteInput.value  = "";
    els.deleteBtn.style.display = "none";
    showModal();
  };

  const openEditModal = (id) => {
    const s = sessions.find(x => x.id === id);
    if (!s) return;
    editingId = id;
    els.modalTitle.textContent = "Edit sleep session";
    els.startInput.value = toLocalInput(s.start);
    els.endInput.value   = toLocalInput(s.end);
    els.noteInput.value  = s.note || "";
    els.deleteBtn.style.display = "";
    showModal();
  };

  const showModal = () => {
    els.modal.classList.add("open");
    setTimeout(() => els.startInput.focus(), 30);
  };
  const hideModal = () => {
    els.modal.classList.remove("open");
    editingId = null;
  };

  const saveModal = () => {
    const start = fromLocalInput(els.startInput.value);
    const end   = fromLocalInput(els.endInput.value);
    if (!Number.isFinite(start) || !Number.isFinite(end)) {
      alert("Please enter a valid start and end time.");
      return;
    }
    if (end <= start) {
      alert("End time must be after start time.");
      return;
    }
    const note = els.noteInput.value.trim();
    if (editingId) {
      const s = sessions.find(x => x.id === editingId);
      if (s) { s.start = start; s.end = end; s.note = note; }
    } else {
      sessions.push({ id: newId(), start, end, note });
    }
    save(sessions);
    hideModal();
    renderAll();
  };

  const deleteEntry = () => {
    if (!editingId) return;
    if (!confirm("Delete this sleep session?")) return;
    sessions = sessions.filter(s => s.id !== editingId);
    save(sessions);
    hideModal();
    renderAll();
  };

  const exportJson = () => {
    const blob = new Blob(
      [JSON.stringify({ exportedAt: new Date().toISOString(), sessions }, null, 2)],
      { type: "application/json" }
    );
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `little-dreams-${todayKey()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  // ---------- wire up ----------
  els.toggleBtn.addEventListener("click", toggleSleep);
  els.addManual.addEventListener("click", openAddModal);
  els.saveBtn.addEventListener("click", saveModal);
  els.cancelBtn.addEventListener("click", hideModal);
  els.deleteBtn.addEventListener("click", deleteEntry);
  els.exportBtn.addEventListener("click", exportJson);
  els.modal.addEventListener("click", (e) => {
    if (e.target === els.modal) hideModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && els.modal.classList.contains("open")) hideModal();
  });

  // refresh "today" stats at midnight rollover
  setInterval(renderSummary, 60 * 1000);

  // start ticking if a session was already running when the page loaded
  if (active) startTicking();

  renderAll();
})();
</script>
</body>
</html>
